# Test the package, build the explorer as one offline HTML page, and publish it with GitHub Pages.
# Repository settings > Pages > Source: "GitHub Actions".
name: Explorer on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test (every recovered and identified formula is checked numerically)
        run: python -m pytest -q
      - name: Build the page
        run: |
          mkdir -p _site
          amr-mdag viz --out _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
