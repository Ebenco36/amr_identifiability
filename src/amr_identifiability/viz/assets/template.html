<div class="app" id="app">

    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="9" width="10" height="10" rx="3"/><path d="M12 14h6"/><path d="M17 10.5l4 3.5-4 3.5"/><ellipse cx="22.5" cy="14" rx="3.5" ry="3.5" stroke-dasharray="2 1.6"/></svg>

    <aside class="panel" id="panel">

      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>
